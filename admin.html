<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Admin Dashboard | 505 Truck Service</title>
</head>
<body class="admin-body">

  <div id="auth-box" class="admin-container" style="max-width: 400px; margin-top: 100px;">
    <h2>Admin Authorization</h2>
    <div class="form-group">
      <label>Security Key</label>
      <input type="password" id="admin-pass" placeholder="••••••••">
    </div>
    <button class="admin-btn" onclick="checkLogin()">Enter Panel</button>
  </div>

  <div id="dashboard-box" class="admin-container" style="display: none;">
    <h2>Content Manager</h2>
    
    <div style="background: #222; padding: 15px; border-radius: 6px; margin-bottom: 25px;">
      <h3>Edit Existing Main Heading / Text</h3>
      <div class="form-group">
        <label>Find and Replace Exact Old Text:</label>
        <input type="text" id="old-text" placeholder="e.g., Welcome to 505 Truck Service">
      </div>
      <div class="form-group">
        <label>Change It To This New Text:</label>
        <input type="text" id="new-text" placeholder="e.g., Premier Mobile Truck Repair">
      </div>
      <button class="admin-btn" onclick="submitTextChange()">Update Text Strings</button>
    </div>

    <div style="background: #222; padding: 15px; border-radius: 6px;">
      <h3>Publish a New Service Card Box</h3>
      <div class="form-group">
        <label>Box Title</label>
        <input type="text" id="box-title" placeholder="e.g., Diesel Engine Diagnostics">
      </div>
      <div class="form-group">
        <label>Image Web Address Link (URL)</label>
        <input type="text" id="box-image" placeholder="https://images.unsplash.com/... or leave blank">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="box-desc" rows="3" placeholder="Describe the item or service specs..."></textarea>
      </div>
      <button class="admin-btn" onclick="submitNewBox()">Inject Service Card</button>
    </div>
  </div>

  <script>
    let sessionPassword = "";

    function checkLogin() {
      const pass = document.getElementById('admin-pass').value;
      if (pass.trim() !== "") {
        sessionPassword = pass;
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('dashboard-box').style.display = 'block';
      } else {
        alert("Please provide an authentication key.");
      }
    }

    async function submitTextChange() {
      const oldText = document.getElementById('old-text').value;
      const newText = document.getElementById('new-text').value;

      const res = await fetch('/api/change-text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: sessionPassword, oldText, newText })
      });

      if (res.ok) {
        alert("Text strings replaced inside index.html successfully!");
        document.getElementById('old-text').value = '';
        document.getElementById('new-text').value = '';
      } else {
        alert("Failed to modify text. Make sure the 'Old Text' matches your website text perfectly.");
      }
    }

    async function submitNewBox() {
      const title = document.getElementById('box-title').value;
      const imgUrl = document.getElementById('box-image').value || 'https://placehold.co/600x400?text=505+Truck+Service';
      const desc = document.getElementById('box-desc').value;

      const res = await fetch('/api/add-box', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: sessionPassword, title, imgUrl, desc })
      });

      if (res.ok) {
        alert("Service card box appended to your website layout!");
        document.getElementById('box-title').value = '';
        document.getElementById('box-image').value = '';
        document.getElementById('box-desc').value = '';
      } else {
        alert("Error saving item container.");
      }
    }
  </script>
</body>
</html>
